[project]
name = "basketball-backend"
version = "0.1.0"
description = "MediaPipe pose extraction and shooting-angle analysis for the HCI basketball project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "mediapipe>=1.2.0",
    "numpy>=1.26",
    "opencv-contrib-python>=5.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
